events {}
http {

  # 1. Definimos el pool de servidores
  upstream product_servers {
    # 2. Listamos los servidores por su nombre de servicio y puerto
    server products_app_1:3002;
    server products_app_2:3002;
  }

  server {
    listen 80;

    location /api/users/ {
      rewrite /api/users/(.*) /$1 break;
      proxy_pass http://users_app:3001; 
      # ...
    }
    
    location /api/products/ {
      rewrite /api/products/(.*) /$1 break;
      # 3. Apuntamos al pool de servidores
      proxy_pass http://product_servers; 
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders/ {
      rewrite /api/orders/(.*) /$1 break;
      proxy_pass http://orders_app:3003;
      # ...
    }
  }
}